name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run fast install test
        run: bash scripts/test-docker.sh
        env:
          DOTFILES_TEST_MODE: fast

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh
      - name: shellcheck (bash)
        run: shellcheck install.sh lib/logging.sh scripts/test-docker.sh tests/verify.sh tests/verify-rollback.sh
      - name: zsh syntax check
        run: |
          set -e
          for f in zsh/.zshenv zsh/.zprofile zsh/.zshrc zsh/aliases.zsh zsh/functions.zsh zsh/completions.zsh scripts/setup-colima.zsh scripts/setup-services.zsh; do
            zsh -n "$f"
            echo "OK $f"
          done

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck scripts
        run: |
          brew install shellcheck || true
          find . -name '*.sh' -o -name '*.zsh' | xargs shellcheck -s bash -e SC1090,SC1091,SC2154 2>&1 || true

      - name: Zsh syntax check
        run: |
          zsh -n zsh/.zshrc 2>&1
          zsh -n zsh/.zshenv 2>&1
          zsh -n zsh/.zprofile 2>&1

      - name: Dry-run install
        run: |
          bash install.sh --dry-run 2>&1

      - name: Verify dry-run left no changes
        run: |
          if [[ -d ~/.dotfiles_backup_* ]]; then
            echo "FAIL: dry-run created backup directory"
            exit 1
          fi
          echo "PASS: dry-run made no changes"
